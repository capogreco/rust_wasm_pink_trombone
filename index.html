<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust WebAssembly Vocal Tract</title>
    <style>
        /* Dark mode styles */
        :root {
            --bg-color: #121212;
            --bg-secondary: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --primary-color: #4285f4;
            --accent-color: #ff5722;
            --error-color: #f44336;
            --success-color: #4caf50;
            --border-color: #333333;
            --disabled-color: #555555;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        h1, h2, h3 {
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        button {
            background-color: var(--primary-color);
            border: none;
            color: white;
            padding: 8px 16px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        button:hover {
            filter: brightness(1.2);
        }
        
        button:disabled {
            background-color: var(--disabled-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .controls {
            margin: 20px 0;
            padding: 15px;
            background-color: var(--bg-secondary);
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }
        
        .slider-container {
            margin: 10px 0;
        }
        
        .slider-container label {
            display: inline-block;
            width: 100px;
            color: var(--text-color);
        }
        
        input[type="range"] {
            width: 250px;
            vertical-align: middle;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            background: #444;
            border-radius: 4px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        
        input[type="checkbox"] {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
        }
        
        .value-display {
            display: inline-block;
            width: 50px;
            text-align: right;
            color: var(--text-color);
        }
        
        .vowel-container {
            margin: 15px 0;
        }
        
        .vowel-button {
            background-color: var(--primary-color);
            margin-right: 5px;
            width: 40px;
        }
        
        .vowel-button.selected {
            background-color: var(--accent-color);
        }
        
        #tractControls {
            display: none;
        }
        
        .info-panel {
            background-color: var(--bg-secondary);
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }
        
        .info-panel h3 {
            margin-top: 0;
            color: var(--text-color);
            border-bottom: none;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        
        .info-label {
            font-weight: bold;
            flex: 1;
            color: var(--text-color);
        }
        
        .info-value {
            flex: 1;
            text-align: right;
            color: var(--primary-color);
        }
        
        #statusMessage {
            padding: 8px;
            border-radius: 4px;
            display: inline-block;
            margin-left: 10px;
        }
        
        /* Status message styling */
        .status-ready {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .status-error {
            background-color: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .status-warning {
            background-color: rgba(255, 87, 34, 0.2);
            color: #ff5722;
        }
        
        .status-info {
            background-color: rgba(33, 150, 243, 0.2);
            color: #2196f3;
        }
        
        /* Tract visualization styles */
        .tract-visualization {
            margin: 20px 0;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--bg-secondary);
        }
        
        #tractCanvas {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin: 10px 0;
            cursor: pointer;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>Rust WebAssembly Vocal Tract</h1>
    
    <div>
        <button id="startButton">Start Audio</button>
        <button id="stopButton" disabled>Stop Audio</button>
        <span id="statusMessage">Ready to start</span>
    </div>
    
    <div id="tractControls" class="controls">
        <h2>Controls</h2>
        
        <div class="slider-container">
            <label for="frequencySlider">Frequency (Hz):</label>
            <input type="range" id="frequencySlider" min="50" max="500" value="140" step="1">
            <span id="frequencyValue" class="value-display">140</span>
        </div>
        
        <div class="slider-container">
            <label for="tensenessSlider">Tenseness:</label>
            <input type="range" id="tensenessSlider" min="0.01" max="0.99" value="0.6" step="0.01">
            <span id="tensenessValue" class="value-display">0.6</span>
        </div>
        
        <div class="slider-container">
            <label for="voicingToggle">Voiced:</label>
            <input type="checkbox" id="voicingToggle" checked>
        </div>
        
        <div class="slider-container">
            <label for="velumSlider">Velum:</label>
            <input type="range" id="velumSlider" min="0.2" max="0.8" value="0.2" step="0.01">
            <span id="velumValue" class="value-display">0.2</span>
        </div>
        
        <div class="tract-visualization">
            <h3>Vocal Tract Visualization</h3>
            <p>Click and drag to modify the tract shape:</p>
            <canvas id="tractCanvas" width="600" height="200"></canvas>
        </div>
        
        <div class="vowel-container">
            <p>Vowels:</p>
            <button class="vowel-button selected" data-vowel="a">A</button>
            <button class="vowel-button" data-vowel="e">E</button>
            <button class="vowel-button" data-vowel="i">I</button>
            <button class="vowel-button" data-vowel="o">O</button>
            <button class="vowel-button" data-vowel="u">U</button>
        </div>
        
        <button id="toggleOscillator">Toggle Oscillator/Model</button>
        <p>Current mode: <span id="oscillatorStatus">Vocal Tract Model</span></p>
    </div>
    
    <div class="info-panel">
        <h3>Performance Information</h3>
        
        <div class="info-row">
            <span class="info-label">Sample Rate:</span>
            <span id="sampleRate" class="info-value">N/A</span>
        </div>
        
        <div class="info-row">
            <span class="info-label">CPU Load:</span>
            <span id="cpuLoad" class="info-value">0%</span>
        </div>
        
        <div class="info-row">
            <span class="info-label">Processing Time:</span>
            <span id="processingTime" class="info-value">0ms</span>
        </div>
        
        <div class="info-row">
            <span class="info-label">Glottal Level:</span>
            <span id="glottalLevel" class="info-value">0</span>
        </div>
        
        <div class="info-row">
            <span class="info-label">Tract Level:</span>
            <span id="tractLevel" class="info-value">0</span>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
