[package]
name = "vocal_tract"
version = "0.1.0"
edition = "2021"
authors = ["Claude"]
description = "Rust implementation of the Pink Trombone vocal tract model for WebAssembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]